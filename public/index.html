rt(`Joining game with nickname: ${nickname} and code: ${gameCode}`);\n            // Implement game joining logic here\n        });\n\n        // Example game canvas setup\n        ctx.fillStyle = 'lightblue';\n        ctx.fillRect(0, 0, canvas.width, canvas.height);\n        ctx.fillStyle = 'black';\n        ctx.font = '30px Arial';\n        ctx.fillText('Game Canvas', 50, 50);\n    </script>\n</body>\n</html>
